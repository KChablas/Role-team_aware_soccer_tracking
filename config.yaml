# ============================================================
# Paths
# ============================================================
dataset_dir: "data/train"
output_dir: "output/predictions"
yolo_weights: "weights/best_v11_fromgcp.pt"
reid_weights: "weights/prtreid-soccernet-baseline.pth.tar"
prtreid_repo_path: "/home/YOUR_USERNAME/prtreid/prtreid/scripts/"

# ============================================================
# Device
# ============================================================
device: "cpu"  # "cuda" or "cpu"

# ============================================================
# Sequences
# ============================================================
# Leave empty list to run ALL sequences found in dataset_dir.
# Otherwise specify explicit list: ["SNMOT-060", "SNMOT-061"]
sequences: []

# ============================================================
# Evaluation
# ============================================================
eval_start_frame: 101
gt_dir: "data/train"

# ============================================================
# Verbosity
# ============================================================
verbose: false

# ============================================================
# Detector
# ============================================================
detector:
  conf_threshold: 0.5
  iou_threshold: 0.1
  keep_img_size: true
  agnostic_nms: false

# ============================================================
# Tracker (StrongSORT)
# ============================================================
tracker:
  max_age: 60
  n_init: 3
  nn_budget: 100
  max_iou_dist: 0.7
  max_dist: 0.4
  mc_lambda: 0.95
  ema_alpha: 0.30
  team_penalty: 0.5
  max_center_dist: 1.2
  enable_custom_cmc: true
  enable_cryo_sleep: true

# ============================================================
# Camera Motion Compensation
# ============================================================
camera:
  grid_rows: 5
  grid_cols: 5

# ============================================================
# Team Assigner (V2)
# ============================================================
team_assigner:
  collection_frames: 30
  crop_mode: "torso"
  min_votes: 1
  # Fitting thresholds
  balance_ratio: 0.25
  outlier_percentile: 85
  max_fit_attempts: 3
  pre_clean_max_fraction: 0.25
  second_outlier_multiplier: 1.8
  peer_consistency_multiplier: 1.8
  peer_max_removals: 3
  # Separation thresholds (multipliers of team_gap)
  separation_threshold: 0.5
  outlier_close_threshold: 0.7
  recovery_match_threshold: 0.4
  candidate_consistency: 0.4
  # Collection targets
  referee_min_crops: 3
  gk_min_crops: 3
  potential_gk_min: 6
  # GK validation tiers
  gk_strong_threshold: 0.8
  gk_reject_threshold: 0.5
  gk_outlier_match: 0.3
  gk_centroid_separation: 0.8
  gk_referee_separation: 0.9
  # Matching leniency
  referee_match_leniency: 0.5
  gk_match_strictness: 0.2
  # Spatial context
  spatial_weight: 0.6
  # Distance blend (must sum to 1.0)
  blend_euclidean: 0.2
  blend_chi_square: 0.5
  blend_weighted: 0.3
